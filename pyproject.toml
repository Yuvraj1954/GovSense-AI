[project]
name = "govesense-ai"
version = "0.1.0"
description = "Govesense AI — MPLADS monitoring dashboard (FastAPI backend + static frontend)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"
