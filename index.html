<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicLens AI - MPLADS Monitoring Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .main-title { font-size: 2rem; font-weight: 800; color: #0F2342; letter-spacing: -0.5px; }
    .main-title span { font-style: italic; color: #C59B27; font-weight: 400; }
    .sub-title { font-size: 0.75rem; font-weight: 700; color: #0F2342; letter-spacing: 3px; margin-top: 6px; }
    .logo-circle {
      width: 160px; height: 160px; background: #FFFFFF; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); margin: 30px 0 40px;
    }
    .logo-circle img { width: 110px; height: 110px; object-fit: contain; }
    .progress-wrap { width: 100%; max-width: 300px; }
    .progress-bar-bg { width: 100%; height: 5px; background: #E2E8F0; border-radius: 10px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #059669, #D97706); border-radius: 10px; transition: width 1s ease-out; }
    .motto { font-size: 0.8rem; color: #94A3B8; margin-top: 14px; font-weight: 500; letter-spacing: 0.3px; }
  </style>
</head>
<body>

  <div>
    <h1 class="main-title">MPLADS <span>Dashboard</span></h1>
    <p class="sub-title">EMPOWERED INDIAN</p>
  </div>

  <div class="logo-circle">
    <img src="logo.png" alt="MPLADS Emblem" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg'">
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="motto">Transparency in Public Infrastructure</p>
  </div>

<script src="js/config.js?v=3"></script>
<script>
(function () {
  var bar = document.getElementById('progressBar');
  var API = (typeof window.API_BASE === 'string') ? window.API_BASE : 'http://127.0.0.1:8000';
  var TTL = 24 * 60 * 60 * 1000;

  function isFresh(key) {
    try { var c = JSON.parse(localStorage.getItem(key)); return c && Date.now() - c.ts < TTL; } catch(e) { return false; }
  }

  // Animate bar to 100% over 1s then redirect
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      bar.style.width = '100%';
    });
  });
  setTimeout(function(){ window.location.href = 'dashboard.html'; }, 1100);

  // Pre-fetch missing data in background during the 1s
  var keys = ['overviewCache','trendCache','statePerfCache','classificationCache','stateClassificationCache','dataUpdatedCache'];
  var missing = [
    ['overviewCache',            '/api/overview'],
    ['trendCache',               '/api/trends'],
    ['statePerfCache',           '/api/state-performance'],
    ['classificationCache',      '/api/classification/distribution'],
    ['stateClassificationCache', '/api/classification/states'],
    ['dataUpdatedCache',         '/api/data-updated']
  ].filter(function(p){ return !isFresh(p[0]); });

  if (missing.length > 0) {
    Promise.all(missing.map(function(p) {
      return fetch(API + p[1]).then(function(r){ return r.json(); }).then(function(d) {
        localStorage.setItem(p[0], JSON.stringify({ data: d, ts: Date.now() }));
      });
    })).catch(function(){});
  }
})();
</script>

</body>
</html>
